name: Publicar vista previa

on:
  push:
    branches: [main, claude/project-thread-jh4kml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Demo para el cliente: no indexar. Quitar al publicar el sitio definitivo.
          PREVIEW: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # El entorno github-pages de este repositorio solo acepta publicar desde esta rama;
    # en main el flujo solo compila. Para publicar desde main, permite esa rama en
    # Settings → Environments → github-pages y cambia esta condición.
    if: github.ref_name == 'claude/project-thread-jh4kml'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
